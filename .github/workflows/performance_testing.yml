name: Performance testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-load-testing:
    name: API load testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run backend with nohup and in background
        run: make run-backend-nohup-background
      - name: API load testing
        uses: QAInsights/PerfAction@v5.6.2
        with:
          test-plan-path: performance_testing/load_testing/api/test_plan.jmx
          args: ""