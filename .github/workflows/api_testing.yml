name: API testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-testing:
    name: API testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run backend with nohup and in background
        run: make run-backend-nohup-background
      - name: Wait for API
        run: make wait-for-api
      - name: API testing
        run: make api-tests