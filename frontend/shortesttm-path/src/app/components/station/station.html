<mat-form-field>
  <mat-label>{{ description }}</mat-label>
  <mat-select
    [attr.id]="
      description === 'Starting station'
        ? 'mat-select-starting-station'
        : 'mat-select-destination-station'
    "
    (selectionChange)="station.emit($event.value)"
    [value]="'Acadie'"
  >
    @for (station of allStations; track station) {
      <mat-option [value]="station">{{ station }}</mat-option>
    }
  </mat-select>
</mat-form-field>
