<div id="main-div">
  <h1>ShortestTM Path</h1>

  <mat-card appearance="outlined">
    <app-instructions></app-instructions>

    <div id="stations-div">
      <app-station
        [description]="'Starting station'"
        [allStations]="allLines$ | async"
        (station)="handleStartingStationFromChild($event)"
      ></app-station>

      <app-station
        [description]="'Destination station'"
        [allStations]="allLines$ | async"
        (station)="handleDestinationStationFromChild($event)"
      ></app-station>
    </div>

    <button matButton="filled" (click)="updateShortestPath()">
      <mat-icon>search</mat-icon>
      Find
    </button>

    @if (errorMessage) {
      <strong><mat-error>Provided stations are on the same line</mat-error></strong>
    }

    <app-shortest-path [shortestPath]="shortestPath$ | async"></app-shortest-path>
  </mat-card>

  <a href="https://github.com/antoinebrunet1/shortesttm-path" target="_blank"
    ><img
      src="images/GitHub_Invertocat_Black.svg"
      alt="GitHub logo with link to the repository of the project"
  /></a>
</div>
